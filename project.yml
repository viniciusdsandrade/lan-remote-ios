name: LanRemote
options:
  bundleIdPrefix: com.lanremote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LanRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LanRemote
        excludes:
          - App/Info.plist
    info:
      path: LanRemote/App/Info.plist
      properties:
        CFBundleDisplayName: Lan Remote
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "O LanRemote precisa acessar sua rede Wi-Fi local para descobrir e controlar sua TV LG NetCast diretamente."
        NSBonjourServices:
          - _roap._tcp
          - _udap._tcp
        UIRequiresPersistentWiFi: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanremote.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        DEVELOPMENT_TEAM: ""

  LanRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LanRemoteTests
    dependencies:
      - target: LanRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanremote.ios.tests
        DEVELOPMENT_TEAM: ""
